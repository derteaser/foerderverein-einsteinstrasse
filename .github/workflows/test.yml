name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Pest tests
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 📦 Setup PHP + install deps
        uses: ./.github/actions/setup-php-composer

      - name: 🏃‍♂️ Run tests
        run: vendor/bin/pest --ci
